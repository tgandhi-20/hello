name: Android CI

# This is the pipeline test for the native Android app: it proves that a
# push actually compiles, that unit tests actually run, and that a debug
# APK actually comes out the other end. Nothing under android/ has been
# built locally — this dev container has no Android SDK and dl.google.com
# is blocked here, so GitHub's ubuntu-latest runner (which ships the SDK)
# is the only place this has ever been compiled.
on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

# Scoped to what the job actually needs: read the repo, write the
# workflow's own artifact upload. Nothing else.
permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Build & test (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.5.x requires JDK 17 to run the Gradle build itself (this is a
      # Gradle/AGP toolchain requirement, independent of minSdk/compileSdk).
      # JDK 21 also works with recent AGP, but 17 is what AGP 8.5's own
      # compatibility docs are written against, so it's the boring, safe
      # choice here rather than something we can't verify locally.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships a preinstalled Android SDK, but not necessarily
      # every platform/build-tools revision this project pins. This installs
      # exactly compileSdk 34 + a matching build-tools version and accepts
      # the SDK licenses non-interactively, so the build doesn't depend on
      # whatever happens to already be on the image.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Official Gradle caching action: caches the wrapper distribution,
      # dependency downloads, and build cache between runs, keyed on the
      # wrapper/lockfiles so a dependency bump invalidates it automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Text-level checks that need no SDK and no Gradle. They run in under a
      # second, before the ~3-minute build, so the classes of error they cover
      # cost one second instead of one round trip. Added after nineteen nested
      # block comments — package globs like `ui/**` written into KDoc — cost a
      # full build to diagnose and reported themselves as "Unclosed comment"
      # at the wrong line.
      - name: Check sources
        run: ./tools/check-sources.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tally-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Does the app actually start?
  #
  # Every other test here runs on the host JVM and would pass on an app that
  # crashes the instant it opens — none of them touch an Activity, the Compose
  # runtime, Room actually opening a database, or the Android Keystore. This
  # job boots a real emulator and launches the app, which is the only check in
  # the project that exercises any of that.
  #
  # Separate job, not a step: it needs KVM and takes several minutes, and a
  # flaky emulator must never block the APK that the build job already
  # produced and uploaded.
  smoke:
    name: Launch on emulator
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The emulator needs hardware acceleration; ubuntu-latest runners expose
      # KVM but not to an unprivileged user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
        working-directory: .

      # API 30 with the ATD (automated test device) image: no Play Services,
      # no animations, markedly faster to boot than a full emulator, and
      # sufficient for "does it reach first frame".
      - name: Run launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            # Pull the captured PNGs off the emulator. `|| true` because a
            # screenshot that did not get written must never fail the job —
            # the point of this step is to produce artifacts to look at.
            mkdir -p build/screenshots
            adb pull /sdcard/Android/data/com.tally.app/files/screenshots build/screenshots || true
            ls -la build/screenshots || true

      # The reason this job exists. Nobody building this app can see it, and a
      # layout can pass every semantics assertion while overlapping its own
      # text or clipping a number.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tally-screenshots
          path: android/build/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 14
