name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/budget-tracking-app-design-03cizp

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between an in-progress run
# and the latest queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The check suites were written to catch specific bugs that already shipped
      # once - a vault-wide lockout, a double-counted bill, an import that
      # silently dropped a transaction - but they were never wired into CI, so
      # for weeks a commit could break every one of them and still deploy, gated
      # only by tsc. Assertions that do not run are documentation, not a safety
      # net. This step is why they are worth having.
      - name: Run check suites
        run: npm run checks

      # A known-vulnerable dependency reaching a finance app unnoticed is exactly
      # the class of problem a lockfile plus an audit gate exists to prevent.
      # Dev-only advisories are excluded: they never reach the user's phone.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      # enablement: true turns Pages on for the repository if it has never been
      # configured, instead of failing with "Get Pages site failed ... Not Found".
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
