<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintrack — Personal Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <span class="brand-logo">₿</span>
                <span class="brand-name">Fintrack</span>
            </div>
            <nav class="nav">
                <button class="nav-item active" data-view="dashboard"><span class="nav-ico">◧</span> Dashboard</button>
                <button class="nav-item" data-view="transactions"><span class="nav-ico">≡</span> Transactions</button>
                <button class="nav-item" data-view="upload"><span class="nav-ico">↥</span> Import Statement</button>
                <button class="nav-item" data-view="budgets"><span class="nav-ico">◑</span> Budgets</button>
                <button class="nav-item" data-view="goals"><span class="nav-ico">◎</span> Saving Goals</button>
                <button class="nav-item" data-view="habits"><span class="nav-ico">∿</span> Spending Habits</button>
                <button class="nav-item" data-view="health"><span class="nav-ico">♥</span> Health Check</button>
                <button class="nav-item" data-view="advice"><span class="nav-ico">✦</span> Advice &amp; Wellbeing</button>
            </nav>
            <div class="sidebar-foot">
                <button id="loadDemo" class="btn btn-ghost btn-sm">Load sample data</button>
                <button id="resetData" class="btn btn-ghost btn-sm danger">Reset all data</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="topbar">
                <h1 id="viewTitle">Dashboard</h1>
                <div class="topbar-right">
                    <label class="month-picker">
                        <span>Month</span>
                        <input type="month" id="monthFilter">
                    </label>
                </div>
            </header>

            <div class="views">
                <!-- Dashboard -->
                <section class="view active" id="view-dashboard"></section>
                <!-- Transactions -->
                <section class="view" id="view-transactions"></section>
                <!-- Upload -->
                <section class="view" id="view-upload"></section>
                <!-- Budgets -->
                <section class="view" id="view-budgets"></section>
                <!-- Goals -->
                <section class="view" id="view-goals"></section>
                <!-- Habits -->
                <section class="view" id="view-habits"></section>
                <!-- Health -->
                <section class="view" id="view-health"></section>
                <!-- Advice -->
                <section class="view" id="view-advice"></section>
            </div>
        </main>
    </div>

    <!-- Modal host -->
    <div class="modal-backdrop" id="modalBackdrop" hidden>
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast-host" id="toastHost"></div>

    <script src="js/data.js"></script>
    <script src="js/categorize.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
