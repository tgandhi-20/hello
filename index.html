<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fintrack — Personal Finance & Budgeting</title>
    <meta name="description" content="Import bank statements, budget by category, track net worth, subscriptions, bills and saving goals — all private, on your device.">
    <meta name="theme-color" content="#0e1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fintrack">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <span class="brand-logo">₿</span>
                <span class="brand-name">Fintrack</span>
            </div>
            <nav class="nav">
                <div class="nav-group">Overview</div>
                <button class="nav-item active" data-view="dashboard"><span class="nav-ico">◧</span> Dashboard</button>
                <button class="nav-item" data-view="networth"><span class="nav-ico">◈</span> Net Worth</button>
                <button class="nav-item" data-view="reports"><span class="nav-ico">▤</span> Reports</button>
                <div class="nav-group">Money in &amp; out</div>
                <button class="nav-item" data-view="transactions"><span class="nav-ico">≡</span> Transactions</button>
                <button class="nav-item" data-view="upload"><span class="nav-ico">↥</span> Import</button>
                <button class="nav-item" data-view="bills"><span class="nav-ico">🗓</span> Bills</button>
                <button class="nav-item" data-view="subscriptions"><span class="nav-ico">🔁</span> Subscriptions</button>
                <div class="nav-group">Plan</div>
                <button class="nav-item" data-view="budgets"><span class="nav-ico">◑</span> Budgets</button>
                <button class="nav-item" data-view="goals"><span class="nav-ico">◎</span> Goals</button>
                <button class="nav-item" data-view="habits"><span class="nav-ico">∿</span> Habits</button>
                <button class="nav-item" data-view="health"><span class="nav-ico">♥</span> Health Check</button>
                <button class="nav-item" data-view="advice"><span class="nav-ico">✦</span> Advice</button>
                <div class="nav-group">System</div>
                <button class="nav-item" data-view="settings"><span class="nav-ico">⚙</span> Settings</button>
            </nav>
            <div class="sidebar-foot">
                <button id="loadDemo" class="btn btn-ghost btn-sm">Load sample data</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
                <h1 id="viewTitle">Dashboard</h1>
                <div class="topbar-right">
                    <label class="month-picker">
                        <span>Month</span>
                        <input type="month" id="monthFilter">
                    </label>
                </div>
            </header>

            <div class="views">
                <section class="view active" id="view-dashboard"></section>
                <section class="view" id="view-networth"></section>
                <section class="view" id="view-reports"></section>
                <section class="view" id="view-transactions"></section>
                <section class="view" id="view-upload"></section>
                <section class="view" id="view-bills"></section>
                <section class="view" id="view-subscriptions"></section>
                <section class="view" id="view-budgets"></section>
                <section class="view" id="view-goals"></section>
                <section class="view" id="view-habits"></section>
                <section class="view" id="view-health"></section>
                <section class="view" id="view-advice"></section>
                <section class="view" id="view-settings"></section>
            </div>
        </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast-host" id="toastHost"></div>

    <script src="js/data.js"></script>
    <script src="js/categorize.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
</body>
</html>
