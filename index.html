<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Fintrack — Personal Finance & Budgeting</title>
    <meta name="description" content="Import bank statements, budget by category, track net worth, subscriptions, bills and saving goals — all private, on your device.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Fintrack">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
    <script>
      // Apply saved/system theme before paint to avoid a flash
      (function () {
        try {
          var saved = localStorage.getItem("fintrack.theme");
          var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 512 512" aria-hidden="true">
                    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#2a78d6"/><stop offset="1" stop-color="#4a3aa7"/>
                    </linearGradient></defs>
                    <rect width="512" height="512" rx="112" fill="url(#lg)"/>
                    <polyline points="112,352 200,286 268,318 400,168" fill="none" stroke="#fff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
                    <circle cx="400" cy="168" r="22" fill="#fff"/>
                    <rect x="120" y="372" width="40" height="40" rx="10" fill="#fff" opacity="0.55"/>
                    <rect x="236" y="352" width="40" height="60" rx="10" fill="#fff" opacity="0.55"/>
                    <rect x="352" y="300" width="40" height="112" rx="10" fill="#fff" opacity="0.7"/>
                </svg>
                <span class="brand-name">Fintrack</span>
            </div>
            <nav class="nav">
                <div class="nav-group">Overview</div>
                <button class="nav-item active" data-view="dashboard"><span class="nav-ico">◧</span> Dashboard</button>
                <button class="nav-item" data-view="networth"><span class="nav-ico">◈</span> Net Worth</button>
                <button class="nav-item" data-view="reports"><span class="nav-ico">▤</span> Reports</button>
                <div class="nav-group">Money in &amp; out</div>
                <button class="nav-item" data-view="transactions"><span class="nav-ico">≡</span> Transactions</button>
                <button class="nav-item" data-view="subscriptions"><span class="nav-ico">🔁</span> Subscriptions</button>
                <button class="nav-item" data-view="bills"><span class="nav-ico">🗓</span> Bills</button>
                <button class="nav-item" data-view="upload"><span class="nav-ico">↥</span> Import</button>
                <div class="nav-group">Plan</div>
                <button class="nav-item" data-view="budgets"><span class="nav-ico">◑</span> Budgets</button>
                <button class="nav-item" data-view="goals"><span class="nav-ico">◎</span> Goals</button>
                <button class="nav-item" data-view="habits"><span class="nav-ico">∿</span> Habits</button>
                <button class="nav-item" data-view="health"><span class="nav-ico">♥</span> Health Check</button>
                <button class="nav-item" data-view="advice"><span class="nav-ico">✦</span> Advice</button>
                <div class="nav-group">System</div>
                <button class="nav-item" data-view="settings"><span class="nav-ico">⚙</span> Settings</button>
            </nav>
            <div class="sidebar-foot">
                <button id="loadDemo" class="btn btn-ghost btn-sm">Load sample data</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle" aria-label="Menu">☰</button>
                <h1 id="viewTitle">Dashboard</h1>
                <div class="topbar-right">
                    <label class="month-picker">
                        <span>Month</span>
                        <input type="month" id="monthFilter">
                    </label>
                    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light or dark theme" title="Toggle theme">◐</button>
                </div>
            </header>

            <div class="views">
                <section class="view active" id="view-dashboard"></section>
                <section class="view" id="view-networth"></section>
                <section class="view" id="view-reports"></section>
                <section class="view" id="view-transactions"></section>
                <section class="view" id="view-upload"></section>
                <section class="view" id="view-bills"></section>
                <section class="view" id="view-subscriptions"></section>
                <section class="view" id="view-budgets"></section>
                <section class="view" id="view-goals"></section>
                <section class="view" id="view-habits"></section>
                <section class="view" id="view-health"></section>
                <section class="view" id="view-advice"></section>
                <section class="view" id="view-settings"></section>
            </div>
        </main>
    </div>

    <!-- Mobile bottom navigation -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
        <button class="bnav-item active" data-view="dashboard"><span class="bico">◧</span>Home</button>
        <button class="bnav-item" data-view="transactions"><span class="bico">≡</span>Activity</button>
        <button class="bnav-item" data-view="budgets"><span class="bico">◑</span>Budgets</button>
        <button class="bnav-item" data-view="subscriptions"><span class="bico">🔁</span>Subs</button>
        <button class="bnav-item" id="moreNavBtn"><span class="bico">⋯</span>More</button>
    </nav>
    <button class="fab" id="fabAdd" aria-label="Add transaction">+</button>

    <!-- More sheet (mobile) -->
    <div class="sheet-backdrop" id="sheetBackdrop" hidden>
        <div class="sheet" id="moreSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-grid">
                <button class="sheet-item" data-view="goals"><span class="bico">◎</span>Goals</button>
                <button class="sheet-item" data-view="networth"><span class="bico">◈</span>Net Worth</button>
                <button class="sheet-item" data-view="reports"><span class="bico">▤</span>Reports</button>
                <button class="sheet-item" data-view="bills"><span class="bico">🗓</span>Bills</button>
                <button class="sheet-item" data-view="upload"><span class="bico">↥</span>Import</button>
                <button class="sheet-item" data-view="habits"><span class="bico">∿</span>Habits</button>
                <button class="sheet-item" data-view="health"><span class="bico">♥</span>Health</button>
                <button class="sheet-item" data-view="advice"><span class="bico">✦</span>Advice</button>
                <button class="sheet-item" data-view="settings"><span class="bico">⚙</span>Settings</button>
            </div>
        </div>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
        <div class="modal" id="modal"></div>
    </div>
    <div class="toast-host" id="toastHost"></div>

    <script src="js/data.js"></script>
    <script src="js/categorize.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").then(function (reg) {
            reg.addEventListener("updatefound", function () {
              var w = reg.installing;
              if (!w) return;
              w.addEventListener("statechange", function () {
                // an updated worker installed while an old one controls the page
                if (w.state === "installed" && navigator.serviceWorker.controller) {
                  var host = document.getElementById("toastHost");
                  var el = document.createElement("div");
                  el.className = "toast success";
                  el.appendChild(document.createTextNode("A new version of Fintrack is ready. "));
                  var btn = document.createElement("button");
                  btn.className = "link-btn";
                  btn.textContent = "Refresh";
                  btn.addEventListener("click", function () { location.reload(); });
                  el.appendChild(btn);
                  host.appendChild(el);
                }
              });
            });
          }).catch(function () {});
        });
      }
    </script>
</body>
</html>
